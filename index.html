LBL={lookup:'استعلام وطباعة إيصال',receipt_dl:'تنزيل إيصال',poster:'إنشاء بوستر',poster_dl:'تنزيل بوستر',share:'مشاركة البوستر',attempt:'محاولة بكود غير موجود'};
const ents=()=>Object.entries(M),cnt=(m,t)=>(m.log||[]).filter(l=>l.t===t).length,sum=t=>ents().reduce((a,[,m])=>a+cnt(m,t),0),reg=m=>m.ok&&m.phone&&m.photo,
 bd=m=>m.ok?'<span class="bd a">مقبول</span>':'<span class="bd r">مرفوض</span>',dts=t=>new Date(t).toLocaleString('ar-EG',{dateStyle:'medium',timeStyle:'short'}),

const mrow=([c,m])=>`<tr class="cl" data-p="${esc(c)}"><td dir="ltr" style="text-align:right">${esc(c)}</td><td>${esc(m.n)||'<span style="color:#777">غير مسجّل</span>'}</td><td>${esc(m.c)}</td><td>${bd(m)}</td><td>${m.ok?(reg(m)?'✓ مكتمل':(m.phone||m.photo)?'جزئي':'—'):''}</td></tr>`,
 tblM=()=>tbl(['الكود','الاسم','اللجنة','الحالة','التسجيل'],rows().map(mrow).join(''));

<details><summary>إضافة مجموعة أكواد</summary><textarea id="nb" placeholder="كل سطر: الكود، الاسم، اللجنة، الحالة (مقبول/مرفوض)" dir="auto"></textarea><button class="sbtn p" id="nbb">إضافة المجموعة</button></details>`,
 fil=()=>`<div class="fm"><input id="fq" placeholder="بحث بالكود أو الاسم أو اللجنة" value="${esc(Q)}"><select id="fc"><option value="">كل اللجان</option>${opt(CFG.cm,FC)}</select><select id="fs"><option value="">كل حالات التسجيل</option><option value="d"${FS==='d'?' selected':''}>مكتمل</option><option value="p"${FS==='p'?' selected':''}>غير مكتمل</option></select></div>`,
 list=(f,a)=>{LF=f;return(a?addF():'')+fil()+`<div id="lt">${tblM()}</div>`},
 dist=()=>{const c={};ents().filter(([,m])=>!m.auto).forEach(([,m])=>{const k=m.c||'—';c[k]=(c[k]||0)+1});const mx=Math.max(1,...Object.values(c));return Object.entries(c).map(([k,v])=>`<div class="hb"><span style="width:120px">${esc(k)}</span><div class="t"><i style="width:${v/mx*100}%"></i></div><b>${v}</b></div>`).join('')||'—'};
const VIEWS={
ov(){const e=ents().filter(([,m])=>!m.auto),a=e.filter(([,m])=>m.ok),dn=a.filter(([,m])=>m.done).length,pct=a.length?Math.round(dn/a.length*100):0,
 S=[['إجمالي الأعضاء',e.length],['المقبولون',a.length],['المرفوضون',e.length-a.length],['سجّلوا بياناتهم',e.filter(([,m])=>m.phone).length],['رفعوا صورهم',e.filter(([,m])=>m.photo).length],['بوسترات منشأة',dn],['بوسترات محمّلة',sum('poster_dl')],['إيصالات محمّلة',sum('receipt_dl')],['إيصالات مطبوعة',sum('lookup')],['مرات المشاركة',sum('share')],['استعلامات بكود غير مسجّل',ents().filter(([,m])=>m.auto).length]];
 return(CFG.pc?'':'<div class="pn" style="margin:0 0 12px;border-color:#c8473d;color:#f0a49a">⚠ كلمة المرور الافتراضية 0000 — غيّرها من الإعدادات</div>')+`<div class="gr">${S.map(([l,v])=>`<div class="sc"><b>${v}</b><small>${l}</small></div>`).join('')}</div><div class="pn"><h4>نسبة إكمال التسجيل — ${pct}%</h4><div class="hb"><div class="t"><i style="width:${pct}%"></i></div></div></div><div class="pn"><h4>توزيع الأعضاء على اللجان</h4>${dist()}</div>`},
mb:()=>list(()=>1,1),ac:()=>list(m=>m.ok),rj:()=>list(m=>!m.ok),
cm(){return`<div class="fm"><input id="cn" placeholder="اسم لجنة جديدة"><button class="btn" id="ca" style="padding:8px 18px">إضافة</button></div>`+tbl(['اللجنة','الأعضاء','المقبولون',''],CFG.cm.map(k=>{const l=ents().filter(([,m])=>m.c===k);return`<tr><td>${esc(k)}</td><td>${l.length}</td><td>${l.filter(([,m])=>m.ok).length}</td><td>${l.length?'':`<button class="sbtn" data-cd="${esc(k)}">حذف</button>`}</td></tr>`}).join(''))},
rc:()=>tbl(['الكود','الاسم','إيصالات مطبوعة','إيصالات محمّلة'],ents().map(([c,m])=>`<tr class="cl" data-p="${esc(c)}"><td dir="ltr" style="text-align:right">${esc(c)}</td><td>${esc(m.n)}</td><td>${cnt(m,'lookup')}</td><td>${cnt(m,'receipt_dl')?'تم ('+cnt(m,'receipt_dl')+')':'لم يتم'}</td></tr>`).join('')),
ps:()=>tbl(['الصورة','الاسم','البوستر','التنزيل','المشاركة'],ents().filter(([,m])=>m.ok).map(([c,m])=>`<tr class="cl" data-p="${esc(c)}"><td>${m.photo?`<img src="${m.photo}" alt="">`:'—'}</td><td>${esc(m.n)}</td><td>${m.done?'تم إنشاؤه':'لم يتم'}</td><td>${cnt(m,'poster_dl')}</td><td>${cnt(m,'share')}</td></tr>`).join('')),
lg(){const L=[];ents().forEach(([c,m])=>(m.log||[]).forEach(l=>L.push({c,n:m.n,...l})));AT.forEach(a=>L.push({c:a.c,n:'—',t:'attempt',at:a.at}));L.sort((a,b)=>b.at-a.at);return tbl(['الوقت','الكود','الاسم','الحركة'],L.slice(0,200).map(l=>`<tr><td>${dts(l.at)}</td><td dir="ltr" style="text-align:right">${esc(l.c)}</td><td>${esc(l.n)}</td><td>${LBL[l.t]||l.t}</td></tr>`).join(''))},
st(){return`<div class="pn" style="margin-top:0"><h4>التسجيل (البوستر)</h4><p style="margin:0 0 10px;color:#9a9588;font-size:14px">الحالة: ${CFG.open?'مفتوح':'مغلق'}</p><button class="btn" id="tg">${CFG.open?'إيقاف التسجيل':'فتح التسجيل'}</button></div>
<div class="pn"><h4>تغيير كلمة المرور</h4><div class="fm"><input type="password" id="po" placeholder="الحالية" dir="ltr"><input type="password" id="pw" placeholder="الجديدة (أرقام فقط، ٤ فأكثر)" inputmode="numeric" dir="ltr"><button class="btn" id="cp" style="padding:8px 18px">تغيير</button></div><div class="ae" id="ae"></div></div>
<div class="pn"><h4>تصدير التقارير (Excel / CSV)</h4><div class="row" style="margin:0;justify-content:flex-start"><button class="btn g" id="e1">الأعضاء</button><button class="btn g" id="e2">الإحصائيات واللجان</button></div></div>`}};
function renderA(){$('tb').innerHTML=TABS.map(([k,l])=>`<button data-t="${k}" class="${k===TAB?'on':''}">${l}</button>`).join('');$('ab').innerHTML=VIEWS[TAB]()}

$('ab').oninput=e=>{if(e.target.id==='fq'){Q=e.target.value;refT()}};$('ab').onchange=e=>{if(e.target.id==='fc'){FC=e.target.value;refT()}if(e.target.id==='fs'){FS=e.target.value;refT()}};
const csv=r=>'\ufeff'+r.map(a=>a.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
$('ab').onclick=async e=>{const t=e.target.closest('[id],[data-p],[data-cd]');if(!t)return;const id=t.id;
 if(t.dataset.p)return openProf(t.dataset.p);
 if(t.dataset.cd){CFG.cm=CFG.cm.filter(k=>k!==t.dataset.cd);saveC();return renderA()}
 if(id==='na'){const c=$('nc').value.trim().replace(/\D/g,''),n=$('nn').value.trim();if(!c)return aerr('أدخل كودًا رقميًا');if(M[c]&&!M[c].auto)return aerr('الكود مسجّل بالفعل');if(!n)return aerr('أدخل الاسم');M[c]={...(M[c]||{}),n,c:$('ncm').value,ok:+$('ns').value,auto:0};save();renderA()}

 if(id==='cp'){const n=$('pw').value;if(await hx($('po').value)!==CFG.h)return aerr('كلمة المرور الحالية غير صحيحة');if(!/^\d{4,20}$/.test(n))return aerr('أرقام فقط (٤ على الأقل) علشان تتكتب من لوحة الطابعة');CFG.h=await hx(n);CFG.pc=1;saveC();renderA();aerr('تم التغيير ✓')}
 if(id==='e1')saveFile(csv([['الكود','الاسم','اللجنة','الحالة','الهاتف','صورة','بوستر','إيصالات محمّلة','بوستر محمّل','مشاركات'],...ents().map(([c,m])=>['="'+c+'"',m.n,m.c||'',m.ok?'مقبول':'مرفوض',m.phone?'="'+m.phone+'"':'',m.photo?'نعم':'لا',m.done?'نعم':'لا',cnt(m,'receipt_dl'),cnt(m,'poster_dl'),cnt(m,'share')])]),'ESMS-members.csv');
 if(id==='e2'){const e=ents(),a=e.filter(([,m])=>m.ok);saveFile(csv([['البند','القيمة'],['إجمالي الأعضاء',e.length],['المقبولون',a.length],['المرفوضون',e.length-a.length],['سجّلوا بياناتهم',e.filter(([,m])=>m.phone).length],['رفعوا صورهم',e.filter(([,m])=>m.photo).length],['بوسترات منشأة',a.filter(([,m])=>m.done).length],['بوسترات محمّلة',sum('poster_dl')],['إيصالات محمّلة',sum('receipt_dl')],['إيصالات مطبوعة',sum('lookup')],['مشاركات',sum('share')],[],['اللجنة','الأعضاء','المقبولون'],...CFG.cm.map(k=>{const l=e.filter(([,m])=>m.c===k);return[k,l.length,l.filter(([,m])=>m.ok).length]})]),'ESMS-stats.csv')}};
let PC=null,DLC=0;
